        }

            transition: var(--transition-card);
            border: 1px solid var(--border-light);

            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            min-height: 72px;
            cursor: pointer;
            position: relative;

            justify-content: center;

    ];

    // Объединяем "История" в "История России"
    for (let i = 0; i < rawLinks.length; i++) {
        if (rawLinks[i].category === "История") rawLinks[i].category = "История России";
    }

    const getIcon = (link) => {
        if (link.includes('youtu.be') || link.includes('youtube.com')) return '🎬';
        if (link.includes('rutube.ru')) return '▶️';
        if (link.includes('vk.com')) return '📘';
        if (link.includes('telegram')) return '📱';
        if (link.includes('pinterest')) return '📌';
        if (link.includes('pomodoro')) return '🍅';
        if (link.includes('tweek')) return '✅';
        return '🔗';
    };

    const getPriority = (link) => {
        if (link.includes('youtu.be') || link.includes('youtube.com')) return 1;
        return 2;
    };

    // Группировка
    const groups = new Map();
    for (const item of rawLinks) {
        const superCat = item.supercategory.trim();
        const subject = item.category.trim();
        if (!groups.has(superCat)) groups.set(superCat, new Map());
        const subMap = groups.get(superCat);
        if (!subMap.has(subject)) subMap.set(subject, []);
        subMap.get(subject).push(item);
    }
    for (const subMap of groups.values()) {
        for (const items of subMap.values()) {
            items.sort((a, b) => getPriority(a.link) - getPriority(b.link));
        }
    }

    // Избранное
    let favorites = new Set();
    try {
        const saved = localStorage.getItem('favorites_8class');
        if (saved) favorites = new Set(JSON.parse(saved));
    } catch(e) {}
    function saveFavorites() {
        localStorage.setItem('favorites_8class', JSON.stringify([...favorites]));
    }
    function isFavorite(link) { return favorites.has(link); }
    function toggleFavorite(link) {
        if (favorites.has(link)) favorites.delete(link);
        else favorites.add(link);
        saveFavorites();
    }

    let showOnlyFavorites = false;
    let currentSearchQuery = "";

    function getSubjectIcon(subject) {
        if (subject.includes('Математика')) return '📐';
        if (subject.includes('Алгебра')) return '📐';
        if (subject.includes('Геометрия')) return '📏';
        if (subject.includes('Русский')) return '📝';
        if (subject.includes('Английский')) return '🇬🇧';
        if (subject.includes('Литература')) return '📖';
        if (subject.includes('Физика')) return '⚡';
        if (subject.includes('Химия')) return '🧪';
        if (subject.includes('Биология')) return '🧬';
        if (subject.includes('История России')) return '🏛️';
        if (subject.includes('Всеобщая история')) return '🌍';
        if (subject.includes('Обществознание')) return '⚖️';
        if (subject.includes('География')) return '🌍';
        if (subject.includes('Информатика')) return '💻';
        if (subject.includes('Технология')) return '🔧';
        if (subject.includes('ИЗО')) return '🎨';
        if (subject.includes('Музыка')) return '🎵';
        if (subject.includes('ОБЖ')) return '🛡️';
        if (subject.includes('Физкультура')) return '⚽';
        if (subject.includes('Вероятность')) return '📊';
        return '📖';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function createAccordion(title, items, iconEmoji) {
        const accordion = document.createElement('div');
        accordion.className = 'accordion-item';
        
        const header = document.createElement('div');
        header.className = 'accordion-header';
        header.innerHTML = `<div class="header-left"><span class="header-icon">${iconEmoji}</span><span>${escapeHtml(title)}</span></div><span class="chevron">▼</span>`;
        
        const content = document.createElement('div');
        content.className = 'accordion-content';
        
        const container = document.createElement('div');
        container.className = 'links-container';
        
        for (const linkItem of items) {
            let displayName = linkItem.name.replace(/🔴 ▶️|▶️/g, '').trim();
            
            const card = document.createElement('a');
            card.className = 'link-card';
            if (isFavorite(linkItem.link)) card.classList.add('favorited');
            card.href = linkItem.link;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            
            const iconDiv = document.createElement('div');
            iconDiv.className = 'platform-icon';
            iconDiv.textContent = getIcon(linkItem.link);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'card-content';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'card-title';
            titleDiv.textContent = displayName;
            
            const metaDiv = document.createElement('div');
            metaDiv.className = 'card-meta';
            const badge = document.createElement('span');
            badge.className = 'badge-cat';
            badge.textContent = linkItem.category;
            metaDiv.appendChild(badge);
            
            contentDiv.appendChild(titleDiv);
            contentDiv.appendChild(metaDiv);
            
            card.appendChild(iconDiv);
            card.appendChild(contentDiv);
            
            const starBtn = document.createElement('button');
            starBtn.className = 'favorite-star';
            starBtn.innerHTML = isFavorite(linkItem.link) ? '⭐' : '☆';
            if (isFavorite(linkItem.link)) starBtn.classList.add('active-star');
            starBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                toggleFavorite(linkItem.link);
                renderApp();
            });
            card.appendChild(starBtn);
            container.appendChild(card);
        }
        
        content.appendChild(container);
        accordion.appendChild(header);
        accordion.appendChild(content);
        
        header.addEventListener('click', function() {
            const isOpen = content.classList.contains('show');
            content.classList.toggle('show');
            header.classList.toggle('open');
        });
        
        return accordion;
    }

    function renderApp() {
        const app = document.getElementById('app');
        app.innerHTML = '';
        
        // Фильтрация
        const filteredGroups = new Map();
        for (const [superCat, subMap] of groups) {
            const newSubMap = new Map();
            for (const [subject, items] of subMap) {
                let filteredItems = items.filter(function(item) {
                    const matchesSearch = currentSearchQuery === "" || item.name.toLowerCase().includes(currentSearchQuery.toLowerCase());
                    const matchesFavorite = !showOnlyFavorites || favorites.has(item.link);
                    return matchesSearch && matchesFavorite;
                });
                if (filteredItems.length) newSubMap.set(subject, filteredItems);
            }
            if (newSubMap.size) filteredGroups.set(superCat, newSubMap);
        }
        
        // 1. Ресурсы
        const resourcesMap = filteredGroups.get('Ресурсы');
        if (resourcesMap) {
            const mainRes = resourcesMap.get('Основные ресурсы');
            if (mainRes && mainRes.length) app.appendChild(createAccordion('Основные ресурсы', mainRes, '📚'));
            const extraRes = resourcesMap.get('Ещё ресурсы');
            if (extraRes && extraRes.length) app.appendChild(createAccordion('Ещё ресурсы', extraRes, '🔧'));
            for (const [subj, items] of resourcesMap) {
                if (subj !== 'Основные ресурсы' && subj !== 'Ещё ресурсы' && items.length) {
                    app.appendChild(createAccordion(subj, items, '📎'));
                }
            }
        }

        // 2. Приоритетные предметы
        const prioritySubjects = ['География', 'Обществознание', 'Геометрия', 'Вероятность и статистика', 'Алгебра', 'Физика', 'Биология'];
        const prioritySuperCats = ['Общественно-научные предметы', 'Математика и информатика', 'Естественно-научные предметы'];
        
        const priorityItems = [];
        for (const superCat of prioritySuperCats) {
            const subMap = filteredGroups.get(superCat);
            if (!subMap) continue;
            for (const [subject, items] of subMap) {
                if (prioritySubjects.indexOf(subject) !== -1 && items.length) {
                    priorityItems.push({ subject: subject, items: items, superCat: superCat });
                }
            }
        }
        priorityItems.sort(function(a, b) {
            return prioritySubjects.indexOf(a.subject) - prioritySubjects.indexOf(b.subject);
        });
        for (const item of priorityItems) {
            const icon = getSubjectIcon(item.subject);
            app.appendChild(createAccordion(item.subject, item.items, icon));
        }

        // 3. Все остальные
        const extraSuper = 'Дополнительно / Прочее';
        const allSuperCats = Array.from(filteredGroups.keys()).filter(function(k) {
            return k !== 'Ресурсы' && k !== extraSuper;
        }).sort();
        
        for (const superCat of allSuperCats) {
            const subMap = filteredGroups.get(superCat);
            if (!subMap) continue;
            const subjects = Array.from(subMap.keys()).sort();
            for (const subject of subjects) {
                const items = subMap.get(subject);
                if (!items.length) continue;
                if (prioritySubjects.indexOf(subject) !== -1) continue;
                const icon = getSubjectIcon(subject);
                app.appendChild(createAccordion(subject, items, icon));
            }
        }

        // 4. Дополнительно / Прочее
        const extraMap = filteredGroups.get(extraSuper);
        if (extraMap) {
            for (const [subject, items] of extraMap) {
                if (items.length) app.appendChild(createAccordion(subject, items, '🎭'));
            }
        }

        if (app.children.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'empty-message';
            emptyDiv.innerText = showOnlyFavorites ? "⭐ Нет сохранённых ссылок. Добавьте в избранное!" : "🔍 Ничего не найдено. Попробуйте другой запрос.";
            app.appendChild(emptyDiv);
        }
    }

    // Инициализация
    const searchInput = document.getElementById('searchInput');
    const favBtn = document.getElementById('favoritesModeBtn');
    
    searchInput.addEventListener('input', function(e) {
        currentSearchQuery = e.target.value;
        renderApp();
    });
    
    favBtn.addEventListener('click', function() {
        showOnlyFavorites = !showOnlyFavorites;
        if (showOnlyFavorites) favBtn.classList.add('active');
        else favBtn.classList.remove('active');
        renderApp();
    });
    
    renderApp();
})();
